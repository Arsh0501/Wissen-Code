# Optional demo TURN relay. Add this file only after setting TURN_* in .env.aws.
services:
  turn:
    image: coturn/coturn:4.18.0-r0
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --realm=${API_HOST:?Set API_HOST}
      - --relay-ip=${TURN_PRIVATE_IP:?Set EC2 private IPv4 address}
      - --external-ip=${TURN_PUBLIC_IP:?Set EC2 public IPv4 address}/${TURN_PRIVATE_IP:?Set EC2 private IPv4 address}
      - --user=${TURN_USERNAME:?Set TURN_USERNAME}:${TURN_PASSWORD:?Set TURN_PASSWORD}
