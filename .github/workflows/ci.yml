name: Verify Wissen Code
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wissen
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: wissen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wissen -d wissen_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://wissen:test-password@localhost:5432/wissen_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
      JUDGE_MODE: mock
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm --prefix client ci
      - run: npm run db:setup
      - run: npm test
      - run: npm run build
      - name: Start integration services
        run: npm run dev > /tmp/wissen-dev.log 2>&1 &
      - name: Browser workflow checks
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-check.mjs
